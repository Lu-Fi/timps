# Publishes site/ (the project page) and docs/wiki as /docs (mkdocs-material) with GitHub Pages.
name: project page

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/wiki/**'
      - 'mkdocs.yml'
      - 'scripts/build-docs.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'Lu-Fi/timps'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install mkdocs==1.6.1 mkdocs-material==9.8.1
      - run: NO_MKDOCS_2_WARNING=1 scripts/build-docs.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
