# timps DIAGNOSTIC config - minimal variant of camera-small.conf: exactly
# ONE small OSD text item, no privacy mask, no logo, no debug line. NOT a
# shipped config.
#
# ================ DIAGNOSTIC: small resolution, single OSD item ==============
# Context: docs/T31-OSD-rotation-handoff.md. camera-small.conf (640x368 pre-
# rotation, matched to a real working prudynt-t config's pixel count) still
# showed broken OSD (noise band, privacy-rectangle streaks) PLUS a new solid
# green vertical bar - and the log was full of
# "osd stream 0 item 4: rendered 596x52 exceeds frame 368x640 - skipped"
# every ~1s (the debug {fps}/{net}/... line doesn't fit the 368px width).
#
# This strips the test down to the simplest possible case: ONE small,
# guaranteed-to-fit text item (the timestamp, top-left), nothing else on
# video0. If THIS is still garbled/dotted, the problem is squarely in
# libimp's OSD compositing on a rotated+scaled T31 channel, independent of
# item count/size/type. If it's clean, something about having multiple
# regions or an oversized/skipped region was contributing.
#
# RUN (plain, no MS_ROTATE_PRUDYNT_STYLE):
#   CONF_FILE=scripts/camera-small-1osd.conf CAMERA=wuuk_y0510_t31x_sc4336p_ssv6158 \
#     CAM=<ip> ./scripts/deploy.sh
#
# View: rtsp://<ip>:554/ch0 (portrait 368x640-ish). Just a timestamp,
# top-left. Please grab `logread` too.
# ==============================================================================
general.loglevel = 3

sensor.model    = sc4336p
sensor.i2c_addr = 0x30
sensor.fps      = 25
sensor.width    = 2560
sensor.height   = 1440

rtsp.port = 554
http.port = 8880
http.preview_chn = 0

image.running_mode                  = 0
daynight.enabled                    = 1
daynight.total_gain_day_threshold   = 300
daynight.total_gain_night_threshold = 3000
daynight.switch_cmd                 = daynight

video0.enabled   = 1
video0.codec     = h264
video0.width     = 640
video0.height    = 368
video0.fps       = 15
video0.bitrate   = 2000
video0.gop       = 20
video0.rotation  = 90         # CCW (rotTo90=1)
video0.rtsp_path = /ch0
video0.jpeg      = false

video1.enabled   = 1
video1.codec     = h264
video1.width     = 640
video1.height    = 360
video1.fps       = 25
video1.bitrate   = 512
video1.gop       = 50
video1.rtsp_path = /ch1

audio.enabled    = 1
audio.codec      = aac
audio.volume     = 80
audio.gain       = 25

# Exactly ONE small OSD item, nothing else - no privacy mask, no logo, no
# debug line.
osd.enabled      = 1
osd.font_path    = /usr/share/fonts/default.ttf

osd0.enabled = 1
osd0.type    = text
osd0.text    = %H:%M:%S
osd0.x       = 10
osd0.y       = 10
osd0.font_size = 24

osd1.enabled = 0
osd2.enabled = 0
osd3.enabled = 0
osd4.enabled = 0

privacy0.0.enabled = 0

jpeg.enabled     = 1
jpeg.width       = 640
jpeg.height      = 360
jpeg.fps         = 5
video1.jpeg      = true
video1.jpeg_chn  = 4
