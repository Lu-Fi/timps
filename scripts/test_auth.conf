# Minimal timps config for the `make test-auth` self-contained auth run.
# High (unprivileged) ports so it runs without root; RTSP + HTTP creds set so
# the fail-closed checks have something to enforce.
rtsp.enabled = 1
rtsp.port    = 8554
rtsp.user    = thingino
rtsp.pass    = thingino

http.enabled     = 1
http.port        = 8880
http.preview_chn = 0
http.user        = webuser
http.pass        = webpass

video0.enabled   = 1
video0.codec     = h264
video0.width     = 640
video0.height    = 360
video0.fps       = 15
video0.bitrate   = 1000
video0.rc_mode   = cbr
video0.gop       = 30
video0.profile   = 2
video0.rtsp_path = /ch0
video0.imp_chn   = 0
video0.jpeg      = true
video0.jpeg_chn  = 3

video1.enabled   = 1
video1.codec     = h264
video1.width     = 640
video1.height    = 360
video1.fps       = 15
video1.bitrate   = 512
video1.rtsp_path = /ch1
video1.imp_chn   = 1

jpeg.enabled = 1
jpeg.width   = 640
jpeg.height  = 360
jpeg.quality = 75
jpeg.fps     = 5
jpeg.imp_chn = 2
