# timps TEST config - NON-square PORTRAIT, JPEG DISABLED (T31 / SC4336P wuuk)
# =============================================================================
# ISOLATION TEST for the IPU error flood seen with the FS-picWidth fix:
# camera.conf (identical but WITH jpeg-on-video0) produced ~194 ioctl / ~158
# "ipu: error ipu start ret=-1" per run, while OSD came out clean. Prime suspect
# is the JPEG-on-video0 channel (chn 3, 704x1280) sharing the rotated group 0
# and running its own IPU scale op on the rotated frame. This conf is the SAME
# 1280x704->704x1280 rotated portrait with clean OSD + privacy, but with ALL
# JPEG/snapshot paths OFF.
# ERWARTUNG:
#   * ioctl/ipu errors -> 0 (or near)  => the JPEG-on-rotated-FS path is the
#     culprit; the OSD/main-video rotation itself is clean. Fix scope = JPEG.
#   * errors persist                    => the IPU noise is from the core
#     rotation/OSD path; needs deeper work (but OSD still renders clean).
# =============================================================================
general.loglevel = 4

sensor.model    = sc4336p
sensor.i2c_addr = 0x30
sensor.fps      = 25
sensor.width    = 2560
sensor.height   = 1440

rtsp.port = 554
http.port = 8880
http.preview_chn = 0

image.running_mode                  = 0
daynight.enabled                    = 1
daynight.total_gain_day_threshold   = 300
daynight.total_gain_night_threshold = 3000
daynight.switch_cmd                 = daynight

# NON-square portrait: 1280x704 pre-rotation -> 704x1280 out
video0.enabled   = 1
video0.codec     = h264
video0.width     = 1280
video0.height    = 704
video0.fps       = 15
video0.bitrate   = 3000
video0.gop       = 30
video0.rotation  = 270
video0.rtsp_path = /ch0
video0.jpeg      = false      # <-- OFF (isolation)

video1.enabled   = 1
video1.codec     = h264
video1.width     = 640
video1.height    = 360
video1.fps       = 25
video1.bitrate   = 512
video1.gop       = 50
video1.rtsp_path = /ch1
video1.jpeg      = false      # <-- OFF

audio.enabled    = 0

osd.enabled      = 1
osd.font_path    = /usr/share/fonts/default.ttf

privacy0.0.enabled = 1
privacy0.0.x       = 10
privacy0.0.y       = 200
privacy0.0.w       = 200
privacy0.0.h       = 100
privacy0.0.color   = 0x80FF0000

osd0.enabled = 1
osd0.type    = text
osd0.text    = %Y-%m-%d %H:%M:%S
osd0.x       = 10
osd0.y       = 10

osd1.enabled = 1
osd1.type    = text
osd1.text    = {hostname}
osd1.x       = 0
osd1.y       = 10

osd3.enabled  = 1
osd3.type     = logo
osd3.logo     = /usr/share/images/thingino_100x30.bgra
osd3.logo_w   = 100
osd3.logo_h   = 30
osd3.x        = -10
osd3.y        = -10

# dedicated JPEG channel OFF too
jpeg.enabled     = 0
