# timps TEST config - PORTRAIT, ONE small safely-inside OSD (T31 / SC4336P wuuk)
# =============================================================================
# 3rd ISOLATION. noosd run proved the ipu flood comes from the OSD/privacy
# COMPOSITE on the rotated frame (rotation alone = 0 errors), at ~1 error/frame
# = one group-composite pass/frame failing. Hypothesis (user): a region whose
# far edge doesn't fully fit the 704x1280 frame poisons the whole pass.
# This conf has exactly ONE short, small, top-left text well inside the frame,
# NO logo, NO privacy, NO right/bottom-anchored items.
# ERWARTUNG:
#   * ipu errors -> 0  => oversized / edge-touching regions are the cause; fix =
#     clamp every OSD/privacy rect strictly inside the (rotated) frame, with
#     even-alignment, before SetRgnAttr. Then re-enable items one by one.
#   * ipu errors persist => even a tiny safe region errors -> the HW OSD pass on
#     a rotated frame is inherently noisy on this SDK (accept-or-avoid decision).
# =============================================================================
general.loglevel = 4

sensor.model    = sc4336p
sensor.i2c_addr = 0x30
sensor.fps      = 25
sensor.width    = 2560
sensor.height   = 1440

rtsp.port = 554
http.port = 8880
http.preview_chn = 0

image.running_mode                  = 0
daynight.enabled                    = 1
daynight.total_gain_day_threshold   = 300
daynight.total_gain_night_threshold = 3000
daynight.switch_cmd                 = daynight

video0.enabled   = 1
video0.codec     = h264
video0.width     = 1280
video0.height    = 704
video0.fps       = 15
video0.bitrate   = 3000
video0.gop       = 30
video0.rotation  = 270
video0.rtsp_path = /ch0
video0.jpeg      = false

video1.enabled   = 1
video1.codec     = h264
video1.width     = 640
video1.height    = 360
video1.fps       = 25
video1.bitrate   = 512
video1.gop       = 50
video1.rtsp_path = /ch1
video1.jpeg      = false

audio.enabled    = 0

osd.enabled      = 1
osd.font_path    = /usr/share/fonts/default.ttf

# exactly one small static text, top-left, comfortably inside 704x1280
osd0.enabled   = 1
osd0.type      = text
osd0.text      = TEST
osd0.font_size = 24
osd0.x         = 20
osd0.y         = 20

# EXPLICITLY disable everything else (previous run showed 4 overlays leaking in
# from defaults/persistence) so this really is a single, safely-inside region
osd1.enabled = 0
osd2.enabled = 0
osd3.enabled = 0
osd4.enabled = 0
privacy0.0.enabled = 0
privacy0.1.enabled = 0

jpeg.enabled     = 0
