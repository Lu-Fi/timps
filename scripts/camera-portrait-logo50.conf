# timps counter-check: logo at an explicit IN-BAND lower position (y=650)
# Verifies osd_rot_place places a region at an arbitrary in-band y (not just top
# or at the clamp cap): logo bottom edge = 650+30 = 680 <= 704 -> NOT clamped,
# must render at exactly y=650. Top texts stay at y=10 for reference.
# ERWARTUNG: place-log "LOGO portrait(...,650) -> place(...,650)" (no clamp),
#            frame shows the logo ~middle-lower, upright; ipu_err = 0.
general.loglevel = 5      # DEBUG: show the per-region place-log

sensor.model    = sc4336p
sensor.i2c_addr = 0x30
sensor.fps      = 25
sensor.width    = 2560
sensor.height   = 1440

rtsp.port = 554
http.port = 8880
http.preview_chn = 0

image.running_mode = 0
daynight.enabled   = 1
daynight.total_gain_day_threshold   = 300
daynight.total_gain_night_threshold = 3000
daynight.switch_cmd = daynight

video0.enabled   = 1
video0.codec     = h264
video0.width     = 1280
video0.height    = 704
video0.fps       = 15
video0.bitrate   = 3000
video0.gop       = 30
video0.rotation  = 270
video0.rtsp_path = /ch0
video0.jpeg      = false

video1.enabled   = 1
video1.codec     = h264
video1.width     = 640
video1.height    = 360
video1.fps       = 25
video1.rtsp_path = /ch1
video1.jpeg      = false

audio.enabled    = 0

osd.enabled      = 1
osd.font_path    = /usr/share/fonts/default.ttf

osd0.enabled = 1
osd0.type    = text
osd0.text    = %Y-%m-%d %H:%M:%S
osd0.x       = 10
osd0.y       = 10

# LOGO explicit, 650px from the top (in-band, must NOT be clamped)
osd3.enabled  = 1
osd3.type     = logo
osd3.logo     = /usr/share/images/thingino_100x30.bgra
osd3.logo_w   = 100
osd3.logo_h   = 30
osd3.x        = 10
osd3.y        = 650

osd1.enabled = 0
osd2.enabled = 0
osd4.enabled = 0
privacy0.0.enabled = 0
privacy0.1.enabled = 0

jpeg.enabled     = 0
