# timps test - PORTRAIT with OVER-TALL overlays, to exercise the new guards:
#  - osd0: normal time (top)                  -> placed normally
#  - osd1: font_size=800 text                 -> bitmap taller than the 704 band
#                                                -> DISCARDED with a warning (must
#                                                   NOT re-trigger the IPU flood)
#  - privacy0.0: h=900 (> 704 cap)            -> height-capped to 704, y clamped
# ERWARTUNG: ipu_err = 0, ioctl_err = 0. Log shows:
#   "osd stream 0 item 1: rendered ... exceeds usable 704x704 (rotated...) - skipped"
#   "privacy s0 n0 COVER portrait(10,100) -> place(10,0)-... 200x704"
general.loglevel = 5

sensor.model    = sc4336p
sensor.i2c_addr = 0x30
sensor.fps      = 25
sensor.width    = 2560
sensor.height   = 1440

rtsp.port = 554
http.port = 8880
http.preview_chn = 0

image.running_mode = 0
daynight.enabled   = 1
daynight.total_gain_day_threshold   = 300
daynight.total_gain_night_threshold = 3000
daynight.switch_cmd = daynight

video0.enabled   = 1
video0.codec     = h264
video0.width     = 1280
video0.height    = 704
video0.fps       = 15
video0.bitrate   = 3000
video0.gop       = 30
video0.rotation  = 270
video0.rtsp_path = /ch0
video0.jpeg      = false

video1.enabled   = 1
video1.codec     = h264
video1.width     = 640
video1.height    = 360
video1.fps       = 25
video1.rtsp_path = /ch1
video1.jpeg      = false

audio.enabled    = 0

osd.enabled      = 1
osd.font_path    = /usr/share/fonts/default.ttf

osd0.enabled   = 1
osd0.type      = text
osd0.text      = %H:%M:%S
osd0.x         = 10
osd0.y         = 10

# over-tall text: font_size 800 -> bitmap height > 704 band -> must be discarded
osd1.enabled   = 1
osd1.type      = text
osd1.text      = X
osd1.font_size = 800
osd1.x         = 10
osd1.y         = 10

osd2.enabled = 0
osd3.enabled = 0
osd4.enabled = 0

# over-tall privacy cover: h=900 > 704 cap -> height-capped, y clamped into band
privacy0.0.enabled = 1
privacy0.0.x       = 10
privacy0.0.y       = 100
privacy0.0.w       = 200
privacy0.0.h       = 900
privacy0.0.color   = 0x80FF0000
privacy0.1.enabled = 0

jpeg.enabled     = 0
