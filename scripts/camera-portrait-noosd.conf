# timps TEST config - NON-square PORTRAIT, OSD + JPEG OFF (T31 / SC4336P wuuk)
# =============================================================================
# 2nd ISOLATION for the dmesg "ipu: error ipu start ret=-1" flood that PERSISTS
# with JPEG off (~159/run). It only appears with the FS-picWidth=landscape fix
# (all pre-fix runs: 0). This conf runs the SAME 1280x704->704x1280 rotated
# portrait but with OSD *and* privacy *and* JPEG all OFF - pure rotated video.
# ERWARTUNG:
#   * ipu errors -> 0  => the flood is triggered by the OSD/privacy compositing
#     on the rotated frame (the fix works but the HW OSD pass on a rotated frame
#     is what the IPU dislikes). Then the picWidth fix's cost is scoped to OSD.
#   * ipu errors persist => the rotation/scaler IPU op itself is noisy with a
#     landscape picWidth, independent of OSD. Then it is a rotation-path issue.
# Also watch the .cpu.txt the harness now captures: if timpsd CPU% is high, the
# IPU errors mean a per-frame software fallback (real cost); if low, it is
# harmless kernel noise.
# =============================================================================
general.loglevel = 4

sensor.model    = sc4336p
sensor.i2c_addr = 0x30
sensor.fps      = 25
sensor.width    = 2560
sensor.height   = 1440

rtsp.port = 554
http.port = 8880
http.preview_chn = 0

image.running_mode                  = 0
daynight.enabled                    = 1
daynight.total_gain_day_threshold   = 300
daynight.total_gain_night_threshold = 3000
daynight.switch_cmd                 = daynight

video0.enabled   = 1
video0.codec     = h264
video0.width     = 1280
video0.height    = 704
video0.fps       = 15
video0.bitrate   = 3000
video0.gop       = 30
video0.rotation  = 270
video0.rtsp_path = /ch0
video0.jpeg      = false

video1.enabled   = 1
video1.codec     = h264
video1.width     = 640
video1.height    = 360
video1.fps       = 25
video1.bitrate   = 512
video1.gop       = 50
video1.rtsp_path = /ch1
video1.jpeg      = false

audio.enabled    = 0

osd.enabled      = 0          # <-- OSD OFF (isolation)
jpeg.enabled     = 0
