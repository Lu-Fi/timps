# timps DIAGNOSTIC config for the WUUK Y0510 (T31 / SC4336P) - active-scaler
# hypothesis test for T31 OSD-on-rotation. NOT a shipped/production config.
#
# ======================= DIAGNOSTIC: scale=0 (no downscale) ===================
# Context: docs/T31-OSD-rotation-handoff.md ("ON-DEVICE TEST RESULT",
# "The contradiction we could not resolve"). scripts/camera.conf (video0 =
# 1280x704 from a 2560x1440 sensor, i.e. scale=1, active FrameSource
# downscaler) shows broken OSD/privacy on a rotated ch0 in BOTH rotTo90
# directions - text renders as static dots, a plain solid privacy rectangle
# shears into diagonal stripes. Video itself stays clean.
#
# Leading hypothesis: the ACTIVE SCALER (not CW vs CCW) corrupts geometry the
# OSD/rotate stride math depends on. This config tests that directly by
# setting video0 to the SAME resolution as the sensor (2560x1440) so
# `scale = (sensor != stream)` becomes 0 in fs_create() - the FrameSource
# scaler is disabled entirely (see hal_ingenic.c:623).
#
# CAVEATS (read before running):
#   - This is FAR above the vendor's documented FS-rotate cap (<=1280x704,
#     <=15fps) - libimp's software rotate transposes the WHOLE 2560x1440
#     frame per frame on the CPU. Expect high CPU load, large rmem
#     allocations, and a real chance this simply fails to start, drops to a
#     crawl, or OOMs. That failure would itself be informative (scale=0 isn't
#     practically usable on this hardware) but isn't the primary thing we're
#     testing - watch for whether it runs at all before reading the OSD.
#   - 1440 is NOT a multiple of 64 (1440 & 63 == 32) - the T31 FS-rotate
#     header requires 64-alignment. hal_ingenic.c will log a WARN about this
#     and proceed anyway. If the picture shows a corrupted STRIP only near
#     the bottom edge, that's the expected alignment artifact and NOT the
#     stride-shear bug this test is about; the diagonal-shear/dot pattern
#     across the WHOLE frame is what to look for.
#   - video0.jpeg is left OFF here (unlike camera.conf) to cut one moving part
#     out of an already marginal test.
#
# TWO RUNS WORTH DOING WITH THIS FILE (same binary, no rebuild needed to
# switch - the toggle is a runtime getenv):
#
#   1) timps' own default rotate path at scale=0:
#        CONF_FILE=scripts/camera-scale0.conf CAMERA=wuuk_y0510_t31x_sc4336p_ssv6158 \
#          CAM=<ip> ./scripts/deploy.sh
#      -> does OSD come out clean once the scaler is out of the picture, even
#         with timps' own (pre-rotation scaler, pre-rotation SetChnRotate)
#         setup? If yes: the scaler alone was the whole problem, no need to
#         match prudynt's exact FrameSource attrs.
#
#   2) prudynt-t's EXACT FrameSource attrs at scale=0 (the real hypothesis
#      test - this is the scenario we believe explains "OSD works in
#      prudynt-t"):
#        MS_ROTATE_PRUDYNT_STYLE=1 CONF_FILE=scripts/camera-scale0.conf \
#          CAMERA=wuuk_y0510_t31x_sc4336p_ssv6158 CAM=<ip> ./scripts/deploy.sh
#      -> scaler.outwidth/outheight AND SetChnRotate ALSO get post-rotation
#         dims (hal_ingenic.c: rotate_prudynt_style_mode()). At scale=0 this
#         should be numerically inert either way (scaler disabled), so (1)
#         and (2) SHOULD give the same result - if they don't, that's a new
#         clue.
#
# View: rtsp://<ip>:554/ch0 (portrait 1440x2560 this time, not 704x1280).
# Text/logo top band + red 200x100 privacy rectangle. Report back: does it
# even start/stream, and if so, is the OSD clean or still dotted/sheared?
# ==============================================================================
general.loglevel = 3

sensor.model    = sc4336p
sensor.i2c_addr = 0x30
sensor.fps      = 25
sensor.width    = 2560
sensor.height   = 1440

rtsp.port = 554
http.port = 8880
http.preview_chn = 0

image.running_mode                  = 0
daynight.enabled                    = 1
daynight.total_gain_day_threshold   = 300
daynight.total_gain_night_threshold = 3000
daynight.switch_cmd                 = daynight

video0.enabled   = 1
video0.codec     = h264
video0.width     = 2560      # == sensor.width -> scale=0 (no active downscaler)
video0.height    = 1440      # == sensor.height. NOT 64-aligned (1440 & 63 == 32), see caveats above
video0.fps       = 5         # kept low: this is far above the vendor's rotate cap, minimize CPU/rmem risk
video0.bitrate   = 4000
video0.gop       = 10
video0.rotation  = 90        # CCW (rotTo90=1) - same direction as scripts/camera.conf, for comparability
video0.rtsp_path = /ch0
video0.jpeg      = false     # deliberately off - one less moving part in an already marginal test

video1.enabled   = 1
video1.codec     = h264
video1.width     = 640
video1.height    = 360
video1.fps       = 25
video1.bitrate   = 512
video1.gop       = 50
video1.rtsp_path = /ch1

audio.enabled    = 1
audio.codec      = aac
audio.volume     = 80
audio.gain       = 25

# Same OSD/privacy test setup as scripts/camera.conf, unchanged so results
# are comparable side by side.
osd.enabled      = 1
osd.font_path    = /usr/share/fonts/default.ttf

privacy0.0.enabled = 1
privacy0.0.x       = 10
privacy0.0.y       = 200
privacy0.0.w       = 200
privacy0.0.h       = 100
privacy0.0.color   = 0x80FF0000

osd0.enabled = 1
osd0.type    = text
osd0.text    = %Y-%m-%d %H:%M:%S
osd0.x       = 10
osd0.y       = 10

osd1.enabled = 1
osd1.type    = text
osd1.text    = {hostname}
osd1.x       = 0
osd1.y       = 10

osd2.enabled = 1
osd2.type    = text
osd2.text    = {uptime}
osd2.x       = -10
osd2.y       = 10

osd3.enabled  = 1
osd3.type     = logo
osd3.logo     = /usr/share/images/thingino_100x30.bgra
osd3.logo_w   = 100
osd3.logo_h   = 30
osd3.x        = -10
osd3.y        = -10

osd4.enabled = 1
osd4.type    = text
osd4.text    = {fps}fps {net} cpu{cpu} {mem} {clients}cli
osd4.x       = 10
osd4.y       = -10

jpeg.enabled     = 1
jpeg.width       = 640
jpeg.height      = 360
jpeg.fps         = 5
video1.jpeg      = true
video1.jpeg_chn  = 4
