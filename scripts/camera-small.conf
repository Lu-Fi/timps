# timps DIAGNOSTIC config for the WUUK Y0510 (T31 / SC4336P) - resolution-
# scale rerun of the T31 OSD-on-rotation test, matched to the pixel-count
# ballpark of a REAL working prudynt-t deployment. NOT a shipped config.
#
# ===================== DIAGNOSTIC: small resolution, timps default ===========
# Context: docs/T31-OSD-rotation-handoff.md ("MS_ROTATE_PRUDYNT_STYLE WAS A
# FLAWED DIAGNOSTIC", 2026-07-21). A real prudynt-t config from a working T31
# camera (sensor sc2336, 1920x1080) was obtained: stream0.width=368,
# height=640, rotation=1 (CCW) - OSD confirmed CLEAN on that camera (photo +
# log provided). Re-reading prudynt-t's actual source (IMPFramesource.cpp +
# IMPEncoder.cpp, themactep/prudynt-t, which matches the JSON config format
# actually running) shows its FrameSource/encoder geometry setup is
# STRUCTURALLY EQUIVALENT to timps' own default (non-diagnostic) rotate path,
# once the two projects' opposite config conventions are accounted for
# (prudynt's stream.width/height = desired POST-rotation dims; timps'
# videoN.width/height = PRE-rotation dims). The earlier "State C"/
# MS_ROTATE_PRUDYNT_STYLE result (whole-frame corruption) was an artifact of
# a flawed diagnostic (double-swapping timps' already-pre-rotation dims), NOT
# a genuine prudynt-vs-timps difference - see the doc for the full writeup.
#
# So: timps' own default code (no env var, this file doesn't need
# MS_ROTATE_PRUDYNT_STYLE) SHOULD already behave like prudynt's, geometry-
# wise. It doesn't, on this camera, at 1280x704 (see Test 1/3 results). The
# one variable we have NOT controlled for yet: resolution/pixel count. The
# real working prudynt config's PRE-rotation scaler target is ~640x368
# (235,520 px) - about 4x fewer pixels than our usual 1280x704 test
# (901,120 px), and closer to what a substream-class rotate was probably
# validated against by the vendor. This config reruns the SAME OSD/privacy
# test at a comparable pixel count using timps' plain, already-shipped
# default rotate path, to check whether resolution/pixel-count (not CW/CCW,
# not scale=0/1, not "prudynt-style" attrs) is the actual hidden variable.
#
# RUN (plain, no MS_ROTATE_PRUDYNT_STYLE):
#   CONF_FILE=scripts/camera-small.conf CAMERA=wuuk_y0510_t31x_sc4336p_ssv6158 \
#     CAM=<ip> ./scripts/deploy.sh
#
# View: rtsp://<ip>:554/ch0 (portrait 368x640-ish). Same OSD/privacy test
# items. Please grab `logread` too.
# ==============================================================================
general.loglevel = 3

sensor.model    = sc4336p
sensor.i2c_addr = 0x30
sensor.fps      = 25
sensor.width    = 2560
sensor.height   = 1440

rtsp.port = 554
http.port = 8880
http.preview_chn = 0

image.running_mode                  = 0
daynight.enabled                    = 1
daynight.total_gain_day_threshold   = 300
daynight.total_gain_night_threshold = 3000
daynight.switch_cmd                 = daynight

video0.enabled   = 1
video0.codec     = h264
video0.width     = 640        # PRE-rotation (timps convention) - matches the real working
video0.height    = 368        # prudynt config's pre-rotation scaler target (640x368) almost exactly
video0.fps       = 15         # stay within the vendor's documented FS-rotate cap
video0.bitrate   = 2000
video0.gop       = 20
video0.rotation  = 90         # CCW (rotTo90=1) - matches the real working config's rotation=1
video0.rtsp_path = /ch0
video0.jpeg      = false

video1.enabled   = 1
video1.codec     = h264
video1.width     = 640
video1.height    = 360
video1.fps       = 25
video1.bitrate   = 512
video1.gop       = 50
video1.rtsp_path = /ch1

audio.enabled    = 1
audio.codec      = aac
audio.volume     = 80
audio.gain       = 25

# Same OSD/privacy test setup as the other rotate test confs, unchanged so
# results are comparable side by side.
osd.enabled      = 1
osd.font_path    = /usr/share/fonts/default.ttf

privacy0.0.enabled = 1
privacy0.0.x       = 10
privacy0.0.y       = 200
privacy0.0.w       = 200
privacy0.0.h       = 100
privacy0.0.color   = 0x80FF0000

osd0.enabled = 1
osd0.type    = text
osd0.text    = %Y-%m-%d %H:%M:%S
osd0.x       = 10
osd0.y       = 10

osd1.enabled = 1
osd1.type    = text
osd1.text    = {hostname}
osd1.x       = 0
osd1.y       = 10

osd2.enabled = 1
osd2.type    = text
osd2.text    = {uptime}
osd2.x       = -10
osd2.y       = 10

osd3.enabled  = 1
osd3.type     = logo
osd3.logo     = /usr/share/images/thingino_100x30.bgra
osd3.logo_w   = 100
osd3.logo_h   = 30
osd3.x        = -10
osd3.y        = -10

osd4.enabled = 1
osd4.type    = text
osd4.text    = {fps}fps {net} cpu{cpu} {mem} {clients}cli
osd4.x       = 10
osd4.y       = -10

jpeg.enabled     = 1
jpeg.width       = 640
jpeg.height      = 360
jpeg.fps         = 5
video1.jpeg      = true
video1.jpeg_chn  = 4
