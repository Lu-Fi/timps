# timps test - PORTRAIT with JPEG-on-video0 ON, to capture the exact libimp
# reason for the 'ioctl error ret=-1' flood (via logcat) on a rotated stream.
# Minimal OSD (one top text) so the log is dominated by the JPEG path.
general.loglevel = 5      # DEBUG

sensor.model    = sc4336p
sensor.i2c_addr = 0x30
sensor.fps      = 25
sensor.width    = 2560
sensor.height   = 1440

rtsp.port = 554
http.port = 8880
http.preview_chn = 0

image.running_mode = 0
daynight.enabled   = 1
daynight.total_gain_day_threshold   = 300
daynight.total_gain_night_threshold = 3000
daynight.switch_cmd = daynight

video0.enabled   = 1
video0.codec     = h264
video0.width     = 1280
video0.height    = 704
video0.fps       = 15
video0.bitrate   = 3000
video0.gop       = 30
video0.rotation  = 270
video0.rtsp_path = /ch0
video0.jpeg         = true      # <-- the path under test
video0.jpeg_quality = 75
video0.jpeg_fps     = 5
video0.jpeg_chn     = 3

video1.enabled   = 1
video1.codec     = h264
video1.width     = 640
video1.height    = 360
video1.fps       = 25
video1.rtsp_path = /ch1
video1.jpeg      = false

audio.enabled    = 0

osd.enabled      = 1
osd.font_path    = /usr/share/fonts/default.ttf
osd0.enabled = 1
osd0.type    = text
osd0.text    = %H:%M:%S
osd0.x       = 10
osd0.y       = 10
osd1.enabled = 0
osd2.enabled = 0
osd3.enabled = 0
osd4.enabled = 0
privacy0.0.enabled = 0

# dedicated jpeg channel off so only the video0-piggyback JPEG is exercised
jpeg.enabled     = 0
