# timps TEST config - PORTRAIT with OSD BELOW 704 (MS_ROTATE_PICHEIGHT_MAX diagnostic)
# =============================================================================
# Tests whether the square VBM pool (picWidth=picHeight=max(w,h)) lifts the
# libimp OSD range-check on non-square 90/270-rotated T31 streams.
# osd0 is at y=900 (well below the normal 704-pixel band).
# Must be run with: MS_ROTATE_PICHEIGHT_MAX=1 CAM=<ip> CAMERA=<profile> ./scripts/osd-rot-test.sh this.conf
# =============================================================================
general.loglevel = 5

sensor.model    = sc4336p
sensor.i2c_addr = 0x30
sensor.fps      = 25
sensor.width    = 2560
sensor.height   = 1440

rtsp.port = 554
http.port = 8880
http.preview_chn = 0

image.running_mode                  = 0
daynight.enabled                    = 1
daynight.total_gain_day_threshold   = 300
daynight.total_gain_night_threshold = 3000
daynight.switch_cmd                 = daynight

video0.enabled   = 1
video0.codec     = h264
video0.width     = 1280
video0.height    = 704
video0.fps       = 15
video0.bitrate   = 3000
video0.gop       = 30
video0.rotation  = 270
video0.rtsp_path = /ch0
video0.jpeg      = false

video1.enabled   = 1
video1.codec     = h264
video1.width     = 640
video1.height    = 360
video1.fps       = 25
video1.bitrate   = 512
video1.gop       = 50
video1.rtsp_path = /ch1
video1.jpeg      = false

audio.enabled    = 0

osd.enabled      = 1
osd.font_path    = /usr/share/fonts/default.ttf

# BELOW the 704px band - only visible if the diagnostic knob lifts the range-check
osd0.enabled   = 1
osd0.type      = text
osd0.text      = BELOW 704
osd0.font_size = 48
osd0.x         = 300
osd0.y         = 900

osd1.enabled = 0
osd2.enabled = 0
osd3.enabled = 0
osd4.enabled = 0
privacy0.0.enabled = 0
privacy0.1.enabled = 0

jpeg.enabled     = 0
