# timps config for the WUUK Y0510 (T31 / SC4336P)
#
# ============================ DEPLOY-TEST (T31 OSD @ Rotation) ================
# Disassembly-Befund (docs/T31-OSD-disasm-findings.md): libimps OSD-Stufe kann
# rotierte Frames NUR bei rotTo90=1 (CCW) korrekt komponieren; bei rotTo90=2
# (CW) fehlt die Behandlung komplett -> Pixelbrei (libimp-intern, von timps
# nicht fixbar). SEIT 2026-07-21 mappt timps config 90 -> rotTo90=1 (CCW, der
# funktionierende Pfad) und config 270 -> rotTo90=2 (CW, weiterhin kaputt) -
# das ist gegenueber dem alten Mapping VERTAUSCHT (siehe hal_ingenic.c
# fs_create()-Kommentar und docs/T31-OSD-rotation-handoff.md). Dieser Test
# verifiziert den jetzt auf config 90 liegenden funktionierenden Pfad:
#   video0.rotation = 90, Text-OSD AN (osd.enabled=1) + rotes Privacy-Rechteck.
# ERWARTUNG -> INTERPRETATION (Stream rtsp://<ip>/ch0, Portrait 704x1280):
#   * Text/Logo + rotes 200x100-Rechteck oben links sauber und richtig herum
#     -> CCW-OSD-Pfad der libimp funktioniert; 90+OSD ist auf T31 freigegeben,
#        nur 270+OSD bleibt als libimp-Limit dokumentiert.
#   * Rechteck/Text wieder diagonale Streifen
#     -> auch der CCW-Pfad der Kamera-libimp ist defekt; dann gilt der
#        dokumentierte Workaround (OSD nur auf dem nicht-rotierten ch1,
#        ch0 overlay-frei) fuer BEIDE Richtungen.
#
# ERGEBNIS (2026-07-21, echte Kamera): LETZTERES - Text-Band als Punkte/
# TV-Rauschen, Privacy-Rechteck als nach links gescherte Streifen. Video
# bleibt sauber. D.h. der CCW-Pfad ist auf dieser Kamera/SDK (mit aktivem
# FrameSource-Scaler) EBENFALLS kaputt - der Disasm-"Verdikt" gilt hier nicht.
# Siehe docs/T31-OSD-rotation-handoff.md ("ON-DEVICE TEST RESULT") und
# docs/rotation.md ("Known limitation"): Workaround OSD-nur-auf-ch1 gilt jetzt
# fuer BEIDE Richtungen, nicht nur fuer 270.
# Nach dem Test: rotation wieder auf den Wunschwert; bei rotation=270 Overlays
# auf video0 aus (osd0.* wirken als Legacy-Keys auf alle Streams - fuer
# 270 Grad dann auf per-Stream-Keys osd1.N.* nur fuer ch1 umstellen).
# ==============================================================================
general.loglevel = 3

sensor.model    = sc4336p
sensor.i2c_addr = 0x30
sensor.fps      = 25
sensor.width    = 2560
sensor.height   = 1440

rtsp.port = 554         # Standard-RTSP-Port (wie thingino/prudynt) - laeuft als root
http.port = 8880        # muss = produktiver Port sein, damit die WebUI-Preview proxied (127.0.0.1:8880)
http.preview_chn = 0    # rotierten Stream (ch0) in der Preview zeigen

# ---- Tag/Nacht + IR-Cut (fehlte in der Dev-conf -> Bild war lila, IR-Cut offen)
# timps ruft bei Umschaltung das Board-Script "daynight day|night" (IR-Cut-GPIO,
# IR-LEDs, Farbe). Ohne diese Keys wird der IR-Cut nicht gesteuert -> Magenta.
image.running_mode                  = 0      # 0 Tag, 1 Nacht (ISP-Profil beim Start)
daynight.enabled                    = 1
daynight.total_gain_day_threshold   = 300
daynight.total_gain_night_threshold = 3000
daynight.switch_cmd                 = daynight

# Authentifizierung: sobald user/pass gesetzt sind, verlangt RTSP (Digest) UND
# HTTP (Basic) eine Anmeldung. Leer/auskommentiert = offen (kein Login). HTTP
# nutzt die RTSP-Zugangsdaten, wenn http.user/pass nicht separat gesetzt sind.
# Zum Testen deaktiviert - zum Aktivieren einkommentieren und Werte aendern:
# rtsp.user = admin
# rtsp.pass = CHANGE-ME
# http.user = admin
# http.pass = CHANGE-ME

video0.enabled   = 1
video0.codec     = h264
video0.width     = 1280      # T31 90/270 rotate limit: source <= 1280x704, 64-aligned
video0.height    = 704
video0.fps       = 15        # T31 rotate needs <= 15 fps
video0.bitrate   = 3000
video0.gop       = 30
video0.rotation  = 90        # TEST: 90 = CCW (rotTo90=1) = der OSD-faehige libimp-Pfad (seit 2026-07-21)
video0.rtsp_path = /ch0

video1.enabled   = 1
video1.codec     = h264
video1.width     = 640
video1.height    = 360
video1.fps       = 25
video1.bitrate   = 512
video1.gop       = 50
video1.rtsp_path = /ch1

audio.enabled    = 1
audio.codec      = aac      # needs timps built with USE_FAAC=1 (BR2_PACKAGE_FAAC selected)
audio.volume     = 80      # IMP_AI Lautstärke (bei zu leise/laut anpassen)
audio.gain       = 25      # IMP_AI Vorverstärkung

# OSD. This file uses the LEGACY osd<N>.* keys, which apply each item to ALL
# streams; the canonical per-stream keys are osd<S>.<N>.* (stream S item N,
# e.g. osd0.0.text / osd1.0.text) with optional outline / outline_color
# (text stroke) - see timps.conf.example. Position with x/y:
#   > 0  = pixels from the left/top edge
#   < 0  = pixels from the right/bottom edge
#   = 0  = centered on that axis
# Text placeholders: {hostname} {ip} {mac} {fps} {uptime} + strftime
# (%Y %m %d %H %M %S ...). Text is re-rendered only when it changes.
# DEPLOY-TEST: Text-OSD aktiv + Privacy-Rechteck (unten), beide auf dem
# 90-Grad-rotierten ch0 - siehe Testbeschreibung am Dateikopf. Das
# privacy0.0-Rechteck ist OSD_REG_COVER (solid fill), die Texte/Logo sind
# OSD_REG_PIC; beide Typen laufen in libimp durch OSD_Draw_Layer_Cover_Pic
# und muessen bei 90 gemeinsam sauber sein.
osd.enabled      = 1
osd.font_path    = /usr/share/fonts/default.ttf

privacy0.0.enabled = 1
privacy0.0.x       = 10
privacy0.0.y       = 200     # unterhalb der Textzeilen, damit beides sichtbar ist
privacy0.0.w       = 200
privacy0.0.h       = 100
privacy0.0.color   = 0x80FF0000

osd0.enabled = 1
osd0.type    = text
osd0.text    = %Y-%m-%d %H:%M:%S
osd0.x       = 10
osd0.y       = 10

osd1.enabled = 1
osd1.type    = text
osd1.text    = {hostname}
osd1.x       = 0
osd1.y       = 10

osd2.enabled = 1
osd2.type    = text
osd2.text    = {uptime}
osd2.x       = -10
osd2.y       = 10

osd3.enabled  = 1
osd3.type     = logo
osd3.logo     = /usr/share/images/thingino_100x30.bgra
osd3.logo_w   = 100
osd3.logo_h   = 30
osd3.x        = -10
osd3.y        = -10

# Debug-Zeile unten links. Platzhalter:
#   {fps}     gemessene Encoder-FPS
#   {net}     TX-Durchsatz, auto kbit/s <-> Mbit/s (alias {tx})
#   {cpu}     1-Minuten-Load
#   {mem}     freier RAM in MB
#   {clients} aktuelle Zuschauer (Summe ueber alle Videostreams)
osd4.enabled = 1
osd4.type    = text
osd4.text    = {fps}fps {net} cpu{cpu} {mem} {clients}cli
osd4.x       = 10
osd4.y       = -10

jpeg.enabled     = 1
jpeg.width       = 640
jpeg.height      = 360
jpeg.fps         = 5

# Weitere JPEG-Aufloesungen ohne extra rmem: JPEG-Encoder haengt sich an den
# vorhandenen Videokanal (teilt dessen FrameSource). Abruf mit ?chn=N:
#   http://<ip>:8080/snapshot.jpg?chn=0   (1920x1080, von video0)
#   http://<ip>:8080/stream.mjpeg?chn=1   (640x360,   von video1)
video0.jpeg         = true
video0.jpeg_quality = 75
video0.jpeg_fps     = 5
video0.jpeg_chn     = 3      # eindeutiger IMP-Encoder-Kanal
video1.jpeg         = true
video1.jpeg_chn     = 4
