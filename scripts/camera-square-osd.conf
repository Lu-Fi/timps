# timps TEST config - SQUARE rotated stream (T31 / SC4336P wuuk)
# =============================================================================
# HYPOTHESE-TEST (docs/T31-OSD-rotation-handoff.md): der OSD-"Punkte"-Fehler bei
# 90/270 ist ein Buffer-Stride-vs-Content-Breite-Mismatch. Bei 1280x704 ->
# rotate 704x1280 ist der Buffer-Stride = scaler.outwidth = 1280, das OSD
# schreibt aber mit Stride 704 (echte rotierte Breite) -> Zeilen driften ->
# Punkte. 180 hat keinen W/H-Tausch -> Stride passt -> OSD sauber (belegt).
#
# Ein QUADRATISCHER Stream (704x704) hat NACH der Transponierung ebenfalls
# Content-Breite == Buffer-Stride == 704, also KEINEN Mismatch - obwohl der
# Scaler aktiv ist (2560x1440 -> 704x704) und rotate=270 laeuft.
#
# ERWARTUNG (Stream rtsp://<ip>/ch0, 704x704 Portrait==Quadrat):
#   * OSD-Text/Logo + rotes Rechteck SAUBER, keine Punkte
#       -> Stride-These BEWIESEN. Der Fix-Weg ist dann "Buffer-Stride an die
#          rotierte Breite angleichen" (crop statt scale, oder scale=0), nicht
#          die Dim-Tauscherei. FOV ist hier gestaucht - reiner Diagnose-Test.
#   * Weiterhin Punkte
#       -> Stride ist NICHT die (alleinige) Ursache; dann greift die tiefere
#          libimp-These (OSD-Pfad bei aktivem Scaler prinzipiell kaputt).
# =============================================================================
general.loglevel = 4      # ausfuehrlich, damit das Test-Skript alles einsammelt

sensor.model    = sc4336p
sensor.i2c_addr = 0x30
sensor.fps      = 25
sensor.width    = 2560
sensor.height   = 1440

rtsp.port = 554
http.port = 8880          # produktiver Port (WebUI-Preview proxied 127.0.0.1:8880)
http.preview_chn = 0

image.running_mode                  = 0
daynight.enabled                    = 1
daynight.total_gain_day_threshold   = 300
daynight.total_gain_night_threshold = 3000
daynight.switch_cmd                 = daynight

# --- der Test-Stream: QUADRATISCH, rotiert -----------------------------------
video0.enabled   = 1
video0.codec     = h264
video0.width     = 704       # 64-aligned, <= 1280x704 rotate-cap
video0.height    = 704       # QUADRAT: kein W/H-Stride-Mismatch bei rotate
video0.fps       = 15        # T31 rotate <= 15 fps
video0.bitrate   = 2000
video0.gop       = 30
video0.rotation  = 270       # CCW (rotTo90=1) - der Pfad, den wir testen
video0.rtsp_path = /ch0

# Referenz-Substream OHNE Rotation (zum Vergleich - OSD hier immer sauber)
video1.enabled   = 1
video1.codec     = h264
video1.width     = 640
video1.height    = 360
video1.fps       = 25
video1.bitrate   = 512
video1.gop       = 50
video1.rtsp_path = /ch1

audio.enabled    = 0         # fuer den OSD-Test irrelevant, aus = weniger Rauschen im Log

osd.enabled      = 1
osd.font_path    = /usr/share/fonts/default.ttf

# rotes Privacy-Rechteck (OSD_REG_COVER) - dieselbe Compositing-Stufe wie Text
privacy0.0.enabled = 1
privacy0.0.x       = 10
privacy0.0.y       = 200
privacy0.0.w       = 200
privacy0.0.h       = 100
privacy0.0.color   = 0x80FF0000

osd0.enabled = 1
osd0.type    = text
osd0.text    = %Y-%m-%d %H:%M:%S
osd0.x       = 10
osd0.y       = 10

osd1.enabled = 1
osd1.type    = text
osd1.text    = {hostname}
osd1.x       = 0
osd1.y       = 10

osd3.enabled  = 1
osd3.type     = logo
osd3.logo     = /usr/share/images/thingino_100x30.bgra
osd3.logo_w   = 100
osd3.logo_h   = 30
osd3.x        = -10
osd3.y        = -10

# JPEG/Snapshot am Videokanal (teilt dessen FrameSource)
jpeg.enabled     = 1
jpeg.width       = 704
jpeg.height      = 704
jpeg.fps         = 5
video0.jpeg         = true
video0.jpeg_quality = 75
video0.jpeg_fps     = 5
video0.jpeg_chn     = 3
