# timps TEST - PORTRAIT, two texts: one at TOP (y<704), one at BOTTOM (y>704)
# =============================================================================
# The multi-region run showed ALL rects even + inside 704x1280, yet 159 ipu
# errors, and the ONLY region below y=704 (the logo at y=1240) was invisible.
# Hypothesis: with the FS-picWidth-fix (picWidth=1280, picHeight=704 landscape),
# the OSD composite is vertically limited to picHeight=704 - any region with
# y >= ~704 in the 1280-tall portrait writes outside the physical buffer ->
# per-frame IPU error + invisible. Square (704x704) never hits it.
# This isolates it: osd0 TOP at y=20, osd1 BOTTOM at y=1000, nothing else.
# ERWARTUNG (grab the frame + count ipu):
#   * ipu ~0, only TOP visible, BOTTOM missing => vertical range limited to
#     ~picHeight(704); bottom OSD on a rotated portrait needs picHeight=1280.
#   * ipu 159, TOP visible, BOTTOM missing     => same conclusion, the bottom
#     region poisons the whole pass.
#   * both visible, ipu 0                       => not a vertical-range issue.
# =============================================================================
