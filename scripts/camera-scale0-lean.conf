# timps DIAGNOSTIC config for the WUUK Y0510 (T31 / SC4336P) - LEAN rerun of
# the scale=0 active-scaler-hypothesis test. NOT a shipped/production config.
#
# ==================== DIAGNOSTIC: scale=0, minimal footprint =================
# Context: docs/T31-OSD-rotation-handoff.md ("RESULTS OF TESTS 1-3", 2026-07-21).
# scripts/camera-scale0.conf (video0=2560x1440=sensor, scale=0 confirmed via
# log) gave two results:
#   Test 1 (timps default attrs): OSD still broken (same as scale=1) - clean
#     data, ran ~25s before the encoder stalled (chn0 "PollingStream idle -
#     encoder emits no frames").
#   Test 2 (MS_ROTATE_PRUDYNT_STYLE=1): encoder died after exactly ONE frame -
#     inconclusive, confounded by resource exhaustion.
#
# This file drops EVERYTHING except the one channel under test (video0/ch0)
# to free as much of the 50MB rmem budget as possible, and reruns test 2
# (prudynt-style attrs) to see if it can survive long enough to give a real
# answer instead of dying immediately.
#
# WHAT'S DIFFERENT FROM camera-scale0.conf:
#   - video1 (substream) DISABLED - was ~2.8MB across its FrameSource/encoder/
#     JPEG pools (see the accounting in T31-OSD-rotation-handoff.md).
#   - jpeg.* / video0.jpeg / video1.jpeg all DISABLED.
#   - audio DISABLED (audio buffers aren't in the reserved rmem pool as far as
#     we've seen, but removing one more moving part costs nothing here).
#   - Everything else (video0 res/fps/rotation, OSD/privacy test setup)
#     UNCHANGED from camera-scale0.conf so the result is comparable.
#
# HONEST CAVEAT: chn0 alone already accounts for ~29.7MB of the 50MB budget
# (FrameSource VBM pool 11.06MB + encoder source pool 16.59MB + encoder
# stream buffer 3.46MB, all visible in the test 1/2 logs) BEFORE whatever
# libimp's internal SW-rotate bounce buffer costs (not logged, unknown size,
# plausibly another ~5.5MB going by frame size). Dropping video1+jpeg+audio
# frees only ~2.8MB+small change - it is NOT guaranteed to be enough headroom.
# If this ALSO dies after one frame, that points away from "insufficient
# rmem headroom from other channels" and toward something else entirely
# (e.g. the 1440-not-64-aligned height, or a CPU/timing issue, or a genuine
# libimp bug specific to this resolution) - worth noting in the result either
# way, not just a dead end.
#
# RUN (same binary as before, just point at this conf):
#   MS_ROTATE_PRUDYNT_STYLE=1 CONF_FILE=scripts/camera-scale0-lean.conf \
#     CAMERA=wuuk_y0510_t31x_sc4336p_ssv6158 CAM=<ip> ./scripts/deploy.sh
#
# View: rtsp://<ip>:554/ch0 (portrait 1440x2560). Same OSD/privacy test items
# as before. Please grab `logread` output too (watch specifically for
# "PollingStream idle" / "encoder emits no frames" and how long it ran before
# any such message, same as tests 1/2).
# ==============================================================================
general.loglevel = 3

sensor.model    = sc4336p
sensor.i2c_addr = 0x30
sensor.fps      = 25
sensor.width    = 2560
sensor.height   = 1440

rtsp.port = 554
http.port = 8880
http.preview_chn = 0

image.running_mode                  = 0
daynight.enabled                    = 1
daynight.total_gain_day_threshold   = 300
daynight.total_gain_night_threshold = 3000
daynight.switch_cmd                 = daynight

video0.enabled   = 1
video0.codec     = h264
video0.width     = 2560      # == sensor.width -> scale=0 (no active downscaler)
video0.height    = 1440      # == sensor.height. NOT 64-aligned (1440 & 63 == 32)
video0.fps       = 5
video0.bitrate   = 4000
video0.gop       = 10
video0.rotation  = 90        # CCW (rotTo90=1), same as the other rotate test confs
video0.rtsp_path = /ch0
video0.jpeg      = false

video1.enabled   = 0         # OFF - was the substream, not needed for this test

audio.enabled    = 0         # OFF - one less moving part

# Same OSD/privacy test setup as camera.conf / camera-scale0.conf, unchanged
# so the result is directly comparable.
osd.enabled      = 1
osd.font_path    = /usr/share/fonts/default.ttf

privacy0.0.enabled = 1
privacy0.0.x       = 10
privacy0.0.y       = 200
privacy0.0.w       = 200
privacy0.0.h       = 100
privacy0.0.color   = 0x80FF0000

osd0.enabled = 1
osd0.type    = text
osd0.text    = %Y-%m-%d %H:%M:%S
osd0.x       = 10
osd0.y       = 10

osd1.enabled = 1
osd1.type    = text
osd1.text    = {hostname}
osd1.x       = 0
osd1.y       = 10

osd2.enabled = 1
osd2.type    = text
osd2.text    = {uptime}
osd2.x       = -10
osd2.y       = 10

osd3.enabled  = 1
osd3.type     = logo
osd3.logo     = /usr/share/images/thingino_100x30.bgra
osd3.logo_w   = 100
osd3.logo_h   = 30
osd3.x        = -10
osd3.y        = -10

osd4.enabled = 1
osd4.type    = text
osd4.text    = {fps}fps {net} cpu{cpu} {mem} {clients}cli
osd4.x       = 10
osd4.y       = -10

jpeg.enabled     = 0
